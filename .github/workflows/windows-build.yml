# ShowMaster Windows CI（规格 4.2 DoD：Windows 上 ctest 全绿 + 引擎 DLL + Headless 构建；
# build job 之外，desktop job 覆盖 P1-1 sm_desktop：vcpkg Qt 6.7 → SM_BUILD_DESKTOP=ON
# → Release 构建 → windeployqt → --smoke 启动自检（出口项 E2/E3 的 CI 断言））
# 触发：push / PR。运行器 windows-latest 自带 VS2022 + vcpkg + Ninja。
# 本地等价流程见 docs/BUILD_WINDOWS.md §3/§5/§7。
name: windows-build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # vcpkg 二进制缓存：key 用固定前缀+手动版本号（v1），不用 workflow 文件哈希，
      # 否则 workflow 每次微调都会让已编译好的 Qt 缓存整体失效、被迫全量重编。
      # vcpkg 自身 abi-hash 会保证不匹配的旧包自动跳过（保守安全）。
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-cache-${{ runner.os }}-v1
          restore-keys: |
            vcpkg-cache-${{ runner.os }}-

      - name: Install dependencies (vcpkg sqlite3 + ffmpeg)
        shell: pwsh
        env:
          # vcpkg 二进制缓存目录：命中后 sqlite3/ffmpeg 无需再从源码编译。
          # 必须在 step 级 env 设置：runner context 在 job 级 env 不可用。
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-cache
        run: |
          # cache miss 时该目录尚不存在，而 vcpkg 要求它必须是已存在目录。
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install sqlite3:x64-windows
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install ffmpeg:x64-windows

      - name: Enable MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (windows-msvc-debug preset)
        shell: pwsh
        run: |
          cmake --preset windows-msvc-debug `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"

      - name: Build
        shell: pwsh
        run: cmake --build --preset windows-msvc-debug

      - name: Test (ctest)
        shell: pwsh
        run: ctest --preset windows-msvc-debug --output-on-failure

      - name: Smoke test headless (start → login → HTTP request → stop)
        shell: pwsh
        run: |
          # /api/status 需要会话 token（默认账号 admin/admin123，见 src/web/auth.cpp）
          # 故先轮询 /api/login 等服务就绪并换取 token，再带 Bearer 校验 /api/status。
          $proc = Start-Process -FilePath "build\windows-msvc-debug\sm_headless.exe" `
            -ArgumentList "--port","8099" -PassThru -NoNewWindow
          try {
            $login = $null
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $login = Invoke-RestMethod -Uri "http://127.0.0.1:8099/api/login" `
                  -Method Post -ContentType "application/json" `
                  -Body '{"username":"admin","password":"admin123"}' -TimeoutSec 3
                if ($login.token) { break }
              } catch { }
            }
            if (-not $login -or -not $login.token) {
              throw "headless server not ready or login failed"
            }
            $hdr = @{ Authorization = "Bearer $($login.token)" }
            $resp = Invoke-WebRequest -Uri "http://127.0.0.1:8099/api/status" `
              -Headers $hdr -UseBasicParsing -TimeoutSec 5
            if ($resp.StatusCode -ne 200) { throw "status check failed: HTTP $($resp.StatusCode)" }
            $status = $resp.Content | ConvertFrom-Json
            Write-Host "Headless smoke test passed (engines=$($status.engines.Count) sessions=$($status.sessions))"
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Upload binaries (kernel + engine DLLs + headless)
        uses: actions/upload-artifact@v4
        with:
          name: showmaster-win-bin
          path: |
            build/windows-msvc-debug/bin/*.dll
            build/windows-msvc-debug/sm_kernel_smoke.exe
            build/windows-msvc-debug/sm_headless.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # desktop job（P1-1 sm_desktop 的 CI 冒烟覆盖）
  # 覆盖出口项 E2/E3：Qt 6.7（docs/BUILD_WINDOWS.md §7.1 方式 A：官方预编译二进制）
  # → SM_BUILD_DESKTOP=ON → Release 构建 → windeployqt 部署
  # → sm_desktop --smoke 启动自检（退出码 0 = 通过）。
  # 与上方 build job 相互独立：各自全新 runner。
  # 注：早期版本用方式 B（vcpkg 从源码编译 qtbase+qtdeclarative），在 windows-latest
  # （2 vCPU、磁盘很小）上需 >2 小时，最终仍把磁盘写满而失败
  # （"There is not enough space on the disk"）。改用方式 A 后数分钟装好，
  # 兼顾速度与稳定性；sqlite3 仍走 vcpkg（秒级、可命中二进制缓存）。
  # ---------------------------------------------------------------------------
  desktop:
    runs-on: windows-latest
    # Qt 走方式 A（预编译二进制，数分钟装好）；vcpkg 只装 sqlite3（秒级）。
    # 60 分钟对「下载 Qt + 构建 sm_desktop + windeployqt + 冒烟」留有充裕余量。
    timeout-minutes: 60
    env:
      # sqlite3 走 vcpkg 时只编 release，省时省磁盘。
      # 注意：VCPKG_DEFAULT_BINARY_CACHE 未放这里——runner context 在 job 级 env 不可用，
      # 只能在 step 级 env/with 里用 ${{ runner.temp }}（否则整个 workflow 解析报错、0 job）。
      VCPKG_BUILD_TYPE: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # vcpkg 二进制缓存：现在只缓存 sqlite3（Qt 改走官方预编译二进制，不再源码编译）。
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-cache-desktop-${{ runner.os }}-v1
          restore-keys: |
            vcpkg-cache-desktop-${{ runner.os }}-

      # sm_core 在 Windows 依赖 sqlite3（find_package(SQLite3)）；仅此一项走 vcpkg。
      - name: Install sqlite3 (vcpkg, x64-windows)
        shell: pwsh
        env:
          # cache miss 时该目录尚不存在，而 vcpkg 要求它必须是已存在目录。
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-cache
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install sqlite3:x64-windows `
            --clean-after-build

      # Qt 6.7 采用 docs/BUILD_WINDOWS.md §7.1 方式 A（官方预编译二进制，推荐）。
      # 架构取 win64_msvc2019_64：aqt 对 Qt 6.7.2 只提供 msvc2019/msvc2019_arm64/
      # mingw/llvm_mingw，并无 msvc2022 版；而 MSVC 2019 与 2022 二进制兼容
      # （同为 v14x ABI），故可在 VS2022 下直接链接使用——这也是 install-qt-action
      # 对 5.15<=Qt<6.8 的默认架构。
      # 不写 modules：qtdeclarative（Qml/Quick/QuickControls2）与 qtsvg/qttools/
      # qttranslations 均属该版本的默认 base 归档，一次装齐，无需（也无法）作为
      # 可选 module 再指定——恰为 CMakeLists.txt find_package(Qt6 6.7 ...) 所需组件。
      # 该 action 会把 Qt 解压到 runner.workspace，并导出 QT_ROOT_DIR、注入 PATH。
      - name: Install Qt6 (prebuilt via aqt, docs §7.1 方式 A)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          arch: 'win64_msvc2019_64'
          cache: true

      - name: Enable MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (windows-msvc-release preset, SM_BUILD_DESKTOP=ON)
        shell: pwsh
        run: |
          # CMAKE_PREFIX_PATH 指向 aqt 安装的 Qt（方式 A 下 find_package(Qt6) 的查找依据）；
          # CMAKE_TOOLCHAIN_FILE 仍必须保留——sqlite3 来自 vcpkg。
          cmake --preset windows-msvc-release `
            -DSM_BUILD_DESKTOP=ON `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"

      - name: Build sm_desktop
        shell: pwsh
        run: |
          # 构建日志落盘；失败时把诊断行以单条 ::error:: 回显。
          # 原因：本仓库 job 日志接口对外 403（需 admin），匿名只能读到 annotation，
          # 故失败详情必须经 ::error:: 通道才能被外部看到；GitHub 每 step 最多 10 条
          # error annotation，故多行合并为一条。
          $log = Join-Path $env:RUNNER_TEMP "sm_desktop_build.log"
          $prev = $ErrorActionPreference
          # 避免原生命令 stderr 在 pwsh 的 Stop 偏好下被当作终止错误
          $ErrorActionPreference = 'Continue'
          cmake --build --preset windows-msvc-release --target sm_desktop *>&1 |
            Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          $ErrorActionPreference = $prev
          if ($code -ne 0) {
            $lines = @(Get-Content $log)
            $errs = @($lines | Where-Object {
              $_ -match '(?i)error C[0-9]|error LNK|error MSB|fatal error|RCC: Error|moc: |错误'
            } | Select-Object -Unique | Select-Object -First 15)
            if ($errs.Count -eq 0) { $errs = @($lines | Select-Object -Last 15) }
            $msg = ($errs -join ' || ')
            if ($msg.Length -gt 4000) { $msg = $msg.Substring(0, 4000) }
            Write-Host "::error::sm_desktop build failed (exit $code): $msg"
            throw "cmake --build sm_desktop failed with exit code $code"
          }

      - name: Deploy Qt runtime (windeployqt --qmldir)
        shell: pwsh
        run: |
          # 方式 A：windeployqt 位于 aqt 安装的 Qt 的 bin 目录；
          # 布局若有变则在该 Qt 树下兜底搜索一次，找不到即失败（依赖缺失须显式暴露）。
          $deploy = Join-Path $env:QT_ROOT_DIR "bin\windeployqt.exe"
          if (-not (Test-Path $deploy)) {
            $deploy = Get-ChildItem $env:QT_ROOT_DIR -Recurse -Filter windeployqt.exe |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $deploy) { throw "windeployqt.exe not found under $env:QT_ROOT_DIR" }
          Write-Host "windeployqt: $deploy"
          & $deploy "--qmldir" "src\app\qt\qml" "build\windows-msvc-release\sm_desktop.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed with exit code $LASTEXITCODE" }
          # Windows 平台插件必须部署到位，否则 --smoke 无法启动；显式断言以暴露缺件。
          $qwindows = "build\windows-msvc-release\platforms\qwindows.dll"
          if (-not (Test-Path $qwindows)) { throw "platform plugin not deployed: $qwindows" }
          Write-Host "Deployed Qt platform plugin: $qwindows"

      - name: Smoke test sm_desktop (--smoke, expect exit code 0)
        shell: pwsh
        timeout-minutes: 8
        run: |
          # --smoke 语义见 src/app/main_qt.cpp：QML 主窗口装配失败返回 1；
          # 成功则进入事件循环 2.5s（让 Component.onCompleted 与首轮
          # kernelReady/statusChanged 真实执行）后以 0 退出；期间崩溃则非 0。
          #
          # 诊断通道：本仓库 job 日志接口对外 403（需 admin），外部只能读
          # annotation，故此处把进程 stdout/stderr 落盘；失败时以 ::error::
          # 回显诊断行，成功时以 ::notice:: 汇报实际生效的渲染后端。
          #
          # 渲染后端逐级回退：CI runner 无 GPU，Qt Quick 的默认 RHI(D3D11 硬件)
          # 可能取不到设备。Qt 官方文档给出的两级软件化开关依次是
          #   QSG_RHI_PREFER_SOFTWARE_RENDERER=1 → D3D11 WARP 软件光栅化；
          #   QT_QUICK_BACKEND=software          → Qt Quick 软件渲染适配；
          # 再兜底 QT_QPA_PLATFORM=offscreen（完全无窗口的无头平台）。
          # 先跑默认路径以保留真实硬件路径的验证价值，仅在前一级失败时才降级。
          $exe = "build\windows-msvc-release\sm_desktop.exe"
          if (-not (Test-Path $exe)) { throw "sm_desktop.exe not found: $exe" }
          $log = Join-Path $env:RUNNER_TEMP "sm_desktop_smoke.log"
          Remove-Item $log -ErrorAction SilentlyContinue

          $prev = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'   # 原生命令写 stderr 不当作终止错误

          $managed = @('QSG_RHI_PREFER_SOFTWARE_RENDERER', 'QT_QUICK_BACKEND', 'QT_QPA_PLATFORM')
          $attempts = @(
            @{ tag = 'default(D3D11 HW)';      env = @{} },
            @{ tag = 'D3D11 WARP';             env = @{ QSG_RHI_PREFER_SOFTWARE_RENDERER = '1' } },
            @{ tag = 'QtQuick software';       env = @{ QT_QUICK_BACKEND = 'software' } },
            @{ tag = 'offscreen + software';   env = @{ QT_QPA_PLATFORM = 'offscreen'; QT_QUICK_BACKEND = 'software' } }
          )
          $code = -1
          $used = $null
          foreach ($a in $attempts) {
            foreach ($k in $managed) { Remove-Item -Path "env:$k" -ErrorAction SilentlyContinue }
            foreach ($k in $a.env.Keys) { Set-Item -Path "env:$k" -Value $a.env[$k] }
            Write-Host "--- smoke attempt: $($a.tag) ---"
            "=== attempt: $($a.tag) ===" | Out-File -FilePath $log -Append -Encoding utf8
            & $exe --smoke *>&1 | Tee-Object -FilePath $log -Append
            $code = $LASTEXITCODE
            if ($code -eq 0) { $used = $a.tag; break }
            Write-Host "attempt '$($a.tag)' failed with exit code $code"
          }
          $ErrorActionPreference = $prev

          if ($code -ne 0) {
            $lines = @(Get-Content $log)
            $diag = @($lines | Where-Object {
              $_ -match '(?i)qml|warning|error|failed|abort|crash|not found|no such|platform|module|import'
            } | Select-Object -Unique | Select-Object -First 20)
            if ($diag.Count -eq 0) { $diag = @($lines | Select-Object -Last 20) }
            $msg = ($diag -join ' || ')
            if ($msg.Length -gt 4000) { $msg = $msg.Substring(0, 4000) }
            Write-Host "::error::sm_desktop --smoke failed (exit $code; tried default/WARP/software/offscreen): $msg"
            throw "sm_desktop --smoke failed with exit code $code"
          }
          Write-Host "::notice::sm_desktop --smoke passed (exit 0) with rendering backend: $used"

      - name: Upload desktop artifact (sm_desktop + deployed Qt runtime)
        uses: actions/upload-artifact@v4
        with:
          name: showmaster-win-desktop-qt
          # 连同 windeployqt 部署的 Qt 运行库（含 platforms/、qml/ 等子目录），
          # 使产物开箱即可运行。
          path: |
            build/windows-msvc-release/sm_desktop.exe
            build/windows-msvc-release/**/*.dll
          if-no-files-found: error
