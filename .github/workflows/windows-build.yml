# ShowMaster Windows CI（规格 4.2 DoD：Windows 上 ctest 全绿 + 引擎 DLL + Headless 构建）
# 触发：push / PR。运行器 windows-latest 自带 VS2022 + vcpkg + Ninja。
# 本地等价流程见 docs/BUILD_WINDOWS.md §3/§5。
name: windows-build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (vcpkg: sqlite3 + ffmpeg)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install sqlite3:x64-windows
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install ffmpeg:x64-windows

      - name: Enable MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (windows-msvc-debug preset)
        shell: pwsh
        run: |
          cmake --preset windows-msvc-debug `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"

      - name: Build
        shell: pwsh
        run: cmake --build --preset windows-msvc-debug

      - name: Test (ctest)
        shell: pwsh
        run: ctest --preset windows-msvc-debug --output-on-failure

      - name: Smoke test headless (start → HTTP request → stop)
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "build\windows-msvc-debug\sm_headless.exe" `
            -ArgumentList "--port","8099" -PassThru -NoNewWindow
          Start-Sleep -Seconds 3
          $resp = Invoke-WebRequest -Uri "http://127.0.0.1:8099/api/status" -UseBasicParsing -TimeoutSec 5
          if ($resp.StatusCode -ne 200) { throw "status check failed" }
          Write-Host "Headless smoke test passed"
          Stop-Process -Id $proc.Id -Force

      - name: Upload binaries (kernel + engine DLLs + headless)
        uses: actions/upload-artifact@v4
        with:
          name: showmaster-win-bin
          path: |
            build/windows-msvc-debug/bin/*.dll
            build/windows-msvc-debug/sm_kernel_smoke.exe
            build/windows-msvc-debug/sm_headless.exe
          if-no-files-found: error
